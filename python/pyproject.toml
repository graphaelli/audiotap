[project]
name = "audiotap"
version = "0.1.0"
description = "Python bindings for libaudiotap — capture system audio and microphone on macOS"
requires-python = ">=3.10"
license = "MIT"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audiotap"]

[dependency-groups]
dev = ["pytest>=8"]
