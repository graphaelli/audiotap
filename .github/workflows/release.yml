name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15
            arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i '' "s/^version = .*/version = \"${VERSION}\"/" python/pyproject.toml

      - name: Build C library
        run: make build/libaudiotap.dylib

      - name: Build wheel
        run: pip install build && python -m build --wheel
        working-directory: python

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.arch }}
          path: python/dist/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: dylib-${{ matrix.arch }}
          path: build/libaudiotap.dylib

  build-sdist:
    name: Build sdist
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i '' "s/^version = .*/version = \"${VERSION}\"/" python/pyproject.toml

      - name: Build sdist
        run: pip install build && python -m build --sdist
        working-directory: python

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/dist/*.tar.gz

  release:
    name: GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dylib-*
          path: artifacts

      - name: Rename dylibs by architecture
        run: |
          mv artifacts/dylib-arm64/libaudiotap.dylib artifacts/libaudiotap-arm64.dylib
          mv artifacts/dylib-x86_64/libaudiotap.dylib artifacts/libaudiotap-x86_64.dylib

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/libaudiotap-arm64.dylib
            artifacts/libaudiotap-x86_64.dylib
          generate_release_notes: true

  publish:
    name: Publish to PyPI
    needs: [build, build-sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
